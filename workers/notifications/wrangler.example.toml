name = "vulcaniq-notifications"
main = "src/index.js"
compatibility_date = "2026-08-21"

# Copy to wrangler.toml only after creating the D1 database and replacing the ID.
# [[d1_databases]]
# binding = "NOTIFICATIONS_DB"
# database_name = "vulcaniq-notifications"
# database_id = "<CLOUDFLARE_D1_DATABASE_ID>"
# migrations_dir = "migrations"

[triggers]
crons = ["*/10 * * * *"]

[vars]
NOTIFICATION_WARNING_PERCENT = "70"
NOTIFICATION_CONSERVATION_PERCENT = "85"
NOTIFICATION_HARD_STOP_PERCENT = "95"
NOTIFICATION_PUBLIC_DAILY_SEND_CAP = "1000"
NOTIFICATION_BROADCAST_BATCH_CAP = "250"
NOTIFICATION_CRON_PROCESSING_CAP = "100"
ETNA_ROUTINE_MIN_INTERVAL_HOURS = "6"
