name: vulcanIQ Supabase backup

on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: Admin/user who requested the backup from the vulcanIQ admin UI
        required: false
        type: string
      language:
        description: UI language used by the requester
        required: false
        default: en
        type: choice
        options:
          - en
          - it
  schedule:
    # Runs hourly. The job reads public.system_backup_settings and exits when no backup is due.
    - cron: "0 * * * *"

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  backup:
    name: Create import-ready database artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate required secrets
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_PROJECT_REF}"
          test -n "${SUPABASE_DB_URL}"

      - name: Check scheduled backup due
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual backup requested."
            echo "SHOULD_RUN=true" >> "$GITHUB_ENV"
            echo "BACKUP_TRIGGER=manual" >> "$GITHUB_ENV"
            exit 0
          fi

          TABLE_EXISTS="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.system_backup_settings') is not null")"
          if [ "$TABLE_EXISTS" != "t" ]; then
            CURRENT_HOUR="$(date -u +'%H')"
            if [ "$CURRENT_HOUR" = "02" ]; then
              echo "Backup settings table missing; using default daily 02:00 UTC schedule."
              echo "SHOULD_RUN=true" >> "$GITHUB_ENV"
            else
              echo "Backup settings table missing and no default backup is due."
              echo "SHOULD_RUN=false" >> "$GITHUB_ENV"
            fi
            echo "BACKUP_TRIGGER=schedule" >> "$GITHUB_ENV"
            exit 0
          fi

          RESULT="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "
            with s as (
              select
                id,
                enabled,
                frequency,
                utc_hour,
                utc_minute,
                coalesce(weekly_day, 0) as weekly_day,
                coalesce(monthly_day, 1) as monthly_day,
                last_scheduled_backup_at
              from public.system_backup_settings
              where id = 'default'
              union all
              select 'default', true, 'daily', 2, 0, 0, 1, null::timestamptz
              where not exists (select 1 from public.system_backup_settings where id = 'default')
              limit 1
            ),
            n as (
              select now() as now_tz, timezone('utc', now()) as now_utc
            ),
            c as (
              select
                s.*,
                n.now_tz,
                n.now_utc,
                case
                  when frequency = 'daily' then
                    date_trunc('day', n.now_utc) + make_interval(hours => utc_hour, mins => utc_minute)
                  when frequency = 'weekly' then
                    date_trunc('day', n.now_utc)
                    - (((extract(dow from n.now_utc)::int - weekly_day + 7) % 7) * interval '1 day')
                    + make_interval(hours => utc_hour, mins => utc_minute)
                  when frequency = 'monthly' then
                    make_timestamp(
                      extract(year from n.now_utc)::int,
                      extract(month from n.now_utc)::int,
                      least(monthly_day, 28),
                      utc_hour,
                      utc_minute,
                      0
                    )
                end as due_utc
              from s cross join n
            )
            select
              case
                when enabled = true
                  and now_utc >= due_utc
                  and (last_scheduled_backup_at is null or last_scheduled_backup_at < (due_utc at time zone 'UTC'))
                then 'true'
                else 'false'
              end || '|' || coalesce(to_char(due_utc, 'YYYY-MM-DD') || 'T' || to_char(due_utc, 'HH24:MI:SS') || 'Z', '')
            from c;")"

          SHOULD_RUN="${RESULT%%|*}"
          DUE_AT="${RESULT#*|}"
          echo "SHOULD_RUN=${SHOULD_RUN}" >> "$GITHUB_ENV"
          echo "SCHEDULED_BACKUP_DUE_AT=${DUE_AT}" >> "$GITHUB_ENV"
          echo "BACKUP_TRIGGER=schedule" >> "$GITHUB_ENV"

          if [ "$SHOULD_RUN" = "true" ]; then
            echo "Scheduled backup is due at ${DUE_AT}."
          else
            echo "No scheduled backup due."
          fi

      - name: Prepare backup files
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: |
          set -euo pipefail
          BACKUP_CREATED_AT_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BACKUP_STAMP="$(date -u +'%Y-%m-%d_%H-%M-UTC')"
          ARTIFACT_NAME="vulcaniq-supabase-backup-${BACKUP_STAMP}"
          echo "BACKUP_CREATED_AT_UTC=${BACKUP_CREATED_AT_UTC}" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

          rm -rf backup
          mkdir -p backup/storage-assets

          cat > backup/00_project_info.json <<INFO
          {
            "app": "vulcanIQ",
            "backup_created_at_utc": "${BACKUP_CREATED_AT_UTC}",
            "supabase_project_ref": "${SUPABASE_PROJECT_REF}",
            "requested_by": "${{ github.event.inputs.requested_by || github.actor }}",
            "trigger": "${{ github.event_name }}",
            "backup_trigger": "${BACKUP_TRIGGER}",
            "scheduled_backup_due_at_utc": "${SCHEDULED_BACKUP_DUE_AT:-}",
            "includes_roles": true,
            "includes_schema": true,
            "includes_data": true,
            "includes_auth_schema": false,
            "includes_auth_data": false,
            "includes_storage_metadata": false,
            "includes_storage_files": false
          }
          INFO

          cat > backup/cloudflare-env-template.txt <<'ENVFILE'
          # Cloudflare Pages variables for the restored vulcanIQ project.
          # Set production and preview values in Cloudflare Pages > Settings > Environment variables.
          VITE_SUPABASE_URL=https://YOUR-NEW-PROJECT-REF.supabase.co
          SUPABASE_URL=https://YOUR-NEW-PROJECT-REF.supabase.co
          VITE_SUPABASE_ANON_KEY=YOUR-PUBLISHABLE-OR-ANON-KEY
          SUPABASE_ANON_KEY=YOUR-PUBLISHABLE-OR-ANON-KEY
          SUPABASE_SERVICE_ROLE_KEY=YOUR-SERVICE-ROLE-KEY
          VITE_GITHUB_BACKUP_WORKFLOW_URL=https://github.com/YOUR-OWNER/YOUR-REPO/actions/workflows/vulcaniq-db-backup.yml
          GITHUB_OWNER=YOUR-GITHUB-OWNER
          GITHUB_REPO=YOUR-GITHUB-REPO
          GITHUB_BACKUP_WORKFLOW_ID=vulcaniq-db-backup.yml
          GITHUB_BACKUP_REF=main
          GITHUB_BACKUP_TOKEN=YOUR-GITHUB-PAT-WITH-ACTIONS-WORKFLOW-PERMISSION
          NODE_VERSION=20
          ENVFILE

          cat > backup/restore-supabase.sh <<'RESTORESH'
          #!/usr/bin/env bash
          set -euo pipefail

          NEW_DB_URL="${1:-}"

          if [ -z "$NEW_DB_URL" ]; then
            echo "Usage: ./restore-supabase.sh '<postgres-connection-string>'"
            exit 1
          fi

          psql --set ON_ERROR_STOP=on --file "./01_roles.sql" "$NEW_DB_URL"
          psql --set ON_ERROR_STOP=on --file "./02_schema.sql" "$NEW_DB_URL"
          psql --set ON_ERROR_STOP=on --file "./03_data.sql" "$NEW_DB_URL"
          RESTORESH
          chmod +x backup/restore-supabase.sh

          cat > backup/restore-supabase.ps1 <<'RESTOREPS1'
          param(
            [Parameter(Mandatory=$true)]
            [string]$NewDbUrl
          )

          $ErrorActionPreference = "Stop"

          psql --set ON_ERROR_STOP=on --file ".\01_roles.sql" "$NewDbUrl"
          psql --set ON_ERROR_STOP=on --file ".\02_schema.sql" "$NewDbUrl"
          psql --set ON_ERROR_STOP=on --file ".\03_data.sql" "$NewDbUrl"
          RESTOREPS1

          cat > backup/storage-assets/README_STORAGE.md <<'STORAGEREADME'
          # Supabase Storage files

          This database backup does not include binary files stored in Supabase Storage buckets. Supabase-managed internal schemas may also be excluded by the Supabase CLI dump.

          Keep separate copies of uploaded vulcanIQ assets such as leaflets, PDFs, images, and videos. In this project, check the `vulcaniq-public-assets` bucket after any restore and re-upload missing files if needed.

          Future enhancement: add a storage export step that downloads every object from the `vulcaniq-public-assets` bucket into this folder by using a server-side Supabase service role key.
          STORAGEREADME

          cat > backup/README_RESTORE.md <<'RESTOREREADME'
          # vulcanIQ Supabase restore checklist

          This artifact is generated by GitHub Actions. When downloaded from the vulcanIQ admin area, it is a single ZIP containing logical SQL dumps for roles, schema, and data, plus restore scripts and Cloudflare environment-variable guidance.

          ## What is included

          - `00_project_info.json` â€” backup metadata.
          - `01_roles.sql` â€” database role dump from Supabase CLI.
          - `02_schema.sql` â€” database schema dump from Supabase CLI.
          - `03_data.sql` â€” database data dump from Supabase CLI.
          - `restore-supabase.sh` â€” Bash restore helper.
          - `restore-supabase.ps1` â€” PowerShell restore helper.
          - `cloudflare-env-template.txt` â€” variables to recreate in Cloudflare Pages.
          - `storage-assets/README_STORAGE.md` â€” Storage limitation and manual asset guidance.

          ## Restore steps

          1. Create a new Supabase project.
          2. Enable Data API in Supabase.
          3. Set Data API exposed schemas to `public`.
          4. Set extra search path to `public, extensions`.
          5. Download and unzip this artifact locally.
          6. Run the restore script with the new database connection string.
          7. Recreate or verify Supabase Auth users. This ZIP does not fully export/import Auth users.
          8. Insert/verify active owner rows in `public.admin_profiles`.
          9. Update Cloudflare Pages environment variables using `cloudflare-env-template.txt`.
          10. Redeploy Cloudflare Pages.
          11. Verify `/admin` login.
          12. Create one test booking request and verify the admin dashboard and analytics pages.

          ## Bash restore

          ```bash
          ./restore-supabase.sh 'postgresql://postgres:[PASSWORD]@db.YOUR-REF.supabase.co:5432/postgres'
          ```

          ## PowerShell restore

          ```powershell
          .\restore-supabase.ps1 -NewDbUrl 'postgresql://postgres:[PASSWORD]@db.YOUR-REF.supabase.co:5432/postgres'
          ```

          ## Required GitHub repository secrets

          Set these in GitHub > Repository > Settings > Secrets and variables > Actions > New repository secret:

          - `SUPABASE_ACCESS_TOKEN`
          - `SUPABASE_PROJECT_REF`
          - `SUPABASE_DB_URL`

          Do not commit these values to Git and do not place them in frontend `VITE_` variables.

          ## Scheduling

          The workflow runs hourly and checks `public.system_backup_settings`. If no backup is due, it exits successfully without creating an artifact. The vulcanIQ owner can edit the active schedule from the Backup page in the admin area.

          ## Storage limitation

          Supabase database dumps do not include the actual binary files stored in Supabase Storage. Keep separate copies of uploaded leaflets, PDFs, images, and videos, especially files in the `vulcaniq-public-assets` bucket.
          RESTOREREADME

      - name: Dump database roles
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f backup/01_roles.sql

      - name: Dump database schema
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/02_schema.sql

      - name: Dump database data
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: |
          set -euo pipefail
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f backup/03_data.sql

      - name: Validate backup files
        if: ${{ env.SHOULD_RUN == 'true' }}
        run: |
          set -euo pipefail
          test -s backup/00_project_info.json
          test -s backup/01_roles.sql
          test -s backup/02_schema.sql
          test -s backup/03_data.sql
          test -s backup/README_RESTORE.md
          test -s backup/cloudflare-env-template.txt
          test -s backup/restore-supabase.sh
          test -s backup/restore-supabase.ps1
          test -s backup/storage-assets/README_STORAGE.md

      - name: Upload backup artifact
        if: ${{ env.SHOULD_RUN == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: backup/
          if-no-files-found: error
          retention-days: 30

      - name: Mark scheduled backup completed
        if: ${{ github.event_name == 'schedule' && env.SHOULD_RUN == 'true' }}
        run: |
          set -euo pipefail
          TABLE_EXISTS="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.system_backup_settings') is not null")"
          if [ "$TABLE_EXISTS" = "t" ]; then
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "update public.system_backup_settings set last_scheduled_backup_at = now() where id = 'default';"
          fi
