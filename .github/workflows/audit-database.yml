name: VulcanIQ database integrity gate
on:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/**', 'codex/**']
permissions:
  contents: read
jobs:
  local-database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Disposable fresh replay, prior-schema upgrade, RLS and concurrent transactions
        shell: pwsh
        run: ./tools/audit-database-local.ps1
